# Conda environment for the project.
# Create with:  conda env create -f environment.yml   then: conda activate stormtrack
name: stormtrack
channels:
  - defaults
dependencies:
  - python=3.12
  - pandas
  - numpy
  - matplotlib
  - jupyter
  - ipykernel
  - nbconvert
  - requests
  - pip
  - pip:
      - xgboost>=3.0       # notebook 03 (baselines)
      - scikit-learn>=1.5  # notebook 03 (baselines)
      - torch>=2.3         # notebook 04 (LSTM/GRU); uses the Apple GPU (MPS) when available
      - optuna>=4.0        # notebook 06 (Bayesian hyperparameter search)
      - xarray>=2024.1     # scripts/download_ncep.py (NCEP/NCAR reanalysis winds)
      - netCDF4>=1.6       # reading NOAA's OPeNDAP server and the saved wind files
