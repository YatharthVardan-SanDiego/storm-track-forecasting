# Conda environment for the project.
# Create with:  conda env create -f environment.yml   then: conda activate stormtrack
name: stormtrack
channels:
  - defaults
dependencies:
  - python=3.12
  - pandas
  - numpy
  - matplotlib
  - jupyter
  - ipykernel
  - nbconvert
  - requests
  - pip
  - pip:
      - xgboost>=3.0       # notebook 03 (baselines)
      - scikit-learn>=1.5  # notebook 03 (baselines)
  # Added later in the project (neural network stage):
  # - pytorch
